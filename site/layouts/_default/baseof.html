<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.Params.description }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ "/" | relURL }}">Stark</a>
        <nav class="site-nav" aria-label="Primary navigation">
            <a href="{{ "/docs/" | relURL }}">Docs</a>
            <a href="{{ "/book/" | relURL }}">Book</a>
            <a href="{{ "/examples/" | relURL }}">Examples</a>
            <a href="{{ "/roadmap/" | relURL }}">Roadmap</a>
            <a href="{{ "/benchmarks/" | relURL }}">Benchmarks</a>
            <a href="{{ "/downloads/" | relURL }}">Downloads</a>
        </nav>
    </header>
    <main>
        {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
        <span>Stark language documentation.</span>
    </footer>
</body>
</html>
