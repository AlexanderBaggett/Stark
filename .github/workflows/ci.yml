name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install parser generator
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre antlr4

      - name: Verify parser generation is up to date
        run: |
          ./scripts/regenerate-parser.sh
          git diff --exit-code -- src/Parsing/StarkLexer.cs src/Parsing/StarkParser.cs src/Parsing/StarkVisitor.cs src/Parsing/StarkBaseVisitor.cs

      - name: Build website and check links
        run: |
          ./scripts/build-site.sh
          bash ./scripts/check-site-links.sh

      - name: Prepare CI artifact directories
        run: mkdir -p .artifacts/logs .artifacts/test-results

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build Stark.slnx --configuration Release 2>&1 | tee .artifacts/logs/dotnet-build.log

      - name: Check book samples
        shell: bash
        run: |
          set -o pipefail
          ./scripts/check-book-samples.sh 2>&1 | tee .artifacts/logs/book-samples.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test Stark.slnx --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory .artifacts/test-results 2>&1 | tee .artifacts/logs/dotnet-test.log

      - name: Upload failure logs and test artifacts
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-artifacts-linux
          path: |
            .artifacts/logs
            .artifacts/test-results
          if-no-files-found: ignore
