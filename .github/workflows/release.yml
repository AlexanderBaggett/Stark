name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag or candidate label, for example v1.0.0-rc.1.
        required: true
        default: v0.0.0-rc.0
      draft:
        description: Create the GitHub release as a draft.
        type: boolean
        required: true
        default: true
      prerelease:
        description: Mark the GitHub release as a prerelease.
        type: boolean
        required: true
        default: true
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build ${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            asset_suffix: linux-x64
            archive_kind: targz
            stdlib_library: libSystem.a
            target_triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            rid: win-x64
            asset_suffix: windows-x64
            archive_kind: zip
            stdlib_library: System.lib
            target_triple: x86_64-pc-windows-msvc
          - os: macos-15
            rid: osx-arm64
            asset_suffix: macos-arm64
            archive_kind: targz
            stdlib_library: libSystem.a
            target_triple: arm64-apple-macosx11.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Stark.slnx

      - name: Publish compiler
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: >
          dotnet publish src/compiler.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -p:InformationalVersion=$env:RELEASE_VERSION
          -p:IncludeSourceRevisionInInformationalVersion=false
          -p:WriteCompilerLauncherToRepoRoot=false
          -o artifacts/publish/${{ matrix.asset_suffix }}

      - name: Acquire LLVM toolchain
        shell: pwsh
        run: >
          ./scripts/acquire-llvm-toolchain.ps1
          -AssetSuffix ${{ matrix.asset_suffix }}
          -OutputDir artifacts/toolchain/${{ matrix.asset_suffix }}

      - name: Build standard library package
        run: >
          dotnet run --project src --
          stdlib/src/System.stark
          --emit-lib
          --target ${{ matrix.target_triple }}
          --package-profile release
          --toolchain-dir artifacts/toolchain/${{ matrix.asset_suffix }}
          -o artifacts/stdlib/${{ matrix.asset_suffix }}/${{ matrix.stdlib_library }}

      - name: Prepare pinned Raylib release input
        shell: pwsh
        run: >
          ./scripts/prepare-raylib-release-input.ps1
          -AssetSuffix ${{ matrix.asset_suffix }}
          -TargetTriple ${{ matrix.target_triple }}
          -OutputVendorRoot artifacts/vendor/${{ matrix.asset_suffix }}
          -StdlibPackageDir artifacts/stdlib/${{ matrix.asset_suffix }}
          -ToolchainDir artifacts/toolchain/${{ matrix.asset_suffix }}

      - name: Package release archive
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: >
          ./scripts/package-release.ps1
          -Version $env:RELEASE_VERSION
          -AssetSuffix ${{ matrix.asset_suffix }}
          -PublishDir artifacts/publish/${{ matrix.asset_suffix }}
          -StdlibPackageDir artifacts/stdlib/${{ matrix.asset_suffix }}
          -VendorRoot artifacts/vendor/${{ matrix.asset_suffix }}
          -ToolchainDir artifacts/toolchain/${{ matrix.asset_suffix }}
          -RuntimeIdentifier ${{ matrix.rid }}
          -TargetTriple ${{ matrix.target_triple }}
          -CommitSha $env:GITHUB_SHA
          -OutputDir artifacts/release
          -ArchiveKind ${{ matrix.archive_kind }}

      - name: Smoke packaged release archive
        shell: pwsh
        run: >
          ./scripts/smoke-release-archive.ps1
          -ArchivePath "${{ steps.package.outputs.archive_path }}"
          -TargetTriple "${{ matrix.target_triple }}"
          -IsolatePath

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_suffix }}
          path: |
            artifacts/release/stark-*
            !artifacts/release/stage/**
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: install-smoke
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Download release archive artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/downloaded
          merge-multiple: true

      - name: Generate aggregate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath artifacts/downloaded -File |
            Where-Object { $_.Name -notlike "*.sha256" -and $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -LiteralPath artifacts/downloaded/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Stark ${{ env.RELEASE_VERSION }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(env.RELEASE_VERSION, '-') }}
          generate_release_notes: true
          files: artifacts/downloaded/*

  install-smoke:
    name: Install smoke ${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.os }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-x64
            target_triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            asset_suffix: windows-x64
            target_triple: x86_64-pc-windows-msvc
          - os: macos-15
            asset_suffix: macos-arm64
            target_triple: arm64-apple-macosx11.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download candidate release archive
        uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.asset_suffix }}
          path: smoke

      - name: Smoke downloaded release archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath smoke -File |
            Where-Object { $_.Name -like "stark-*-${{ matrix.asset_suffix }}*" -and $_.Extension -ne ".sha256" } |
            Select-Object -First 1
          if (-not $archive) {
            throw "Release archive was not downloaded."
          }

          ./scripts/smoke-release-archive.ps1 `
            -ArchivePath $archive.FullName `
            -TargetTriple "${{ matrix.target_triple }}" `
            -IsolatePath
