name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag or candidate label, for example v1.0.0-rc.1.
        required: true
        default: v0.0.0-rc.0
      draft:
        description: Create the GitHub release as a draft.
        type: boolean
        required: true
        default: true
      prerelease:
        description: Mark the GitHub release as a prerelease.
        type: boolean
        required: true
        default: true
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build ${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            asset_suffix: linux-x64
            archive_kind: targz
            stdlib_library: libSystem.a
          - os: windows-latest
            rid: win-x64
            asset_suffix: windows-x64
            archive_kind: zip
            stdlib_library: System.lib

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Stark.slnx

      - name: Test compiler unit suite
        run: dotnet test tests/compiler.Tests/compiler.Tests.csproj --no-restore --verbosity normal /p:UseSharedCompilation=false

      - name: Test compiler pipeline suite
        run: dotnet test tests/compiler.PipelineTests/compiler.PipelineTests.csproj --no-restore --verbosity normal /p:UseSharedCompilation=false

      - name: Test standard library suite
        run: dotnet test tests/compiler.StandardLibraryTests/compiler.StandardLibraryTests.csproj --no-restore --verbosity normal /p:UseSharedCompilation=false

      - name: Test integration suite
        run: dotnet test tests/compiler.IntegrationTests/compiler.IntegrationTests.csproj --no-restore --verbosity normal /p:UseSharedCompilation=false

      - name: Test feature suite
        run: dotnet test tests/compiler.FeatureTests/compiler.FeatureTests.csproj --no-restore --verbosity normal /p:UseSharedCompilation=false

      - name: Publish compiler
        run: >
          dotnet publish src/compiler.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          -p:WriteCompilerLauncherToRepoRoot=false
          -o artifacts/publish/${{ matrix.asset_suffix }}

      - name: Build standard library package
        run: >
          dotnet run --project src --
          stdlib/src/System.stark
          --emit-lib
          -o artifacts/stdlib/${{ matrix.asset_suffix }}/${{ matrix.stdlib_library }}

      - name: Run release smoke tests
        working-directory: examples
        run: dotnet run --project ../src -- test standard-library-tests --release

      - name: Package release archive
        id: package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: >
          ./scripts/package-release.ps1
          -Version $env:RELEASE_VERSION
          -AssetSuffix ${{ matrix.asset_suffix }}
          -PublishDir artifacts/publish/${{ matrix.asset_suffix }}
          -StdlibPackageDir artifacts/stdlib/${{ matrix.asset_suffix }}
          -OutputDir artifacts/release
          -ArchiveKind ${{ matrix.archive_kind }}

      - name: Upload release archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset_suffix }}
          path: |
            artifacts/release/stark-*
            !artifacts/release/stage/**
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Download release archive artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/downloaded
          merge-multiple: true

      - name: Generate aggregate checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath artifacts/downloaded -File |
            Where-Object { $_.Name -notlike "*.sha256" -and $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -LiteralPath artifacts/downloaded/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Stark ${{ env.RELEASE_VERSION }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(env.RELEASE_VERSION, '-') }}
          generate_release_notes: true
          files: artifacts/downloaded/*

  install-smoke:
    name: Install smoke ${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.os }}
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-x64
            archive_pattern: "*.tar.gz"
          - os: windows-latest
            asset_suffix: windows-x64
            archive_pattern: "*.zip"
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Download release archive from GitHub
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          gh release download $env:RELEASE_VERSION `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "stark-$env:RELEASE_VERSION-${{ matrix.asset_suffix }}${{ matrix.archive_pattern }}" `
            --dir smoke

      - name: Unpack release archive
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath smoke -File |
            Where-Object { $_.Name -like "stark-$env:RELEASE_VERSION-${{ matrix.asset_suffix }}*" -and $_.Extension -ne ".sha256" } |
            Select-Object -First 1
          if (-not $archive) {
            throw "Release archive was not downloaded."
          }

          if ($archive.Name.EndsWith(".zip", [StringComparison]::OrdinalIgnoreCase)) {
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath smoke -Force
          } else {
            tar -xzf $archive.FullName -C smoke
          }

      - name: Compile smoke program from unpacked release
        shell: pwsh
        run: |
          $packageRoot = Get-ChildItem -LiteralPath smoke -Directory |
            Where-Object { $_.Name -like "stark-$env:RELEASE_VERSION-${{ matrix.asset_suffix }}" } |
            Select-Object -First 1
          if (-not $packageRoot) {
            throw "Unpacked release root was not found."
          }

          $compiler = Join-Path $packageRoot.FullName "compiler/compiler"
          if (Test-Path "$compiler.exe") {
            $compiler = "$compiler.exe"
          } elseif (-not $IsWindows) {
            chmod +x $compiler
          }

          $sourcePath = Join-Path (Resolve-Path smoke).Path "Smoke.stark"
          @"
          import System.Console
          module ReleaseSmoke

          export unsafe ffi fn i32[min max] main() {
              System.Console.WriteLine("release smoke");
              return 0;
          }
          "@ | Set-Content -LiteralPath $sourcePath -Encoding utf8

          & $compiler $sourcePath --check -I (Join-Path $packageRoot.FullName "stdlib/dist")
