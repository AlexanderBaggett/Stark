name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag or candidate label, for example v1.0.0-rc.1.
        required: true
        default: v0.0.0-rc.0
      ref:
        description: Git branch, tag, or full commit SHA to resolve once and build immutably.
        required: true
        default: main
      commit:
        description: Optional expected full commit SHA; required to publish unless ref is already a full SHA.
        required: false
        default: ""
      targets:
        description: "all, or a comma-separated subset of targets permitted by include_planned."
        required: true
        default: all
      include_planned:
        description: Include release-disabled planned targets in this diagnostic run. Illegal when publish is enabled.
        type: boolean
        required: true
        default: false
      draft:
        description: Create the GitHub release as a draft.
        type: boolean
        required: true
        default: true
      prerelease:
        description: Mark the GitHub release as a prerelease.
        type: boolean
        required: true
        default: true
      publish:
        description: Create/update a GitHub release after quality, build, and install-smoke jobs pass.
        type: boolean
        required: true
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  prepare:
    name: Validate release configuration
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.release_plan.outputs.matrix }}
      version: ${{ steps.release_plan.outputs.version }}
      source_ref: ${{ steps.release_plan.outputs.source_ref }}
      commit_sha: ${{ steps.release_plan.outputs.commit_sha }}
      target_ids: ${{ steps.release_plan.outputs.target_ids }}
      publish: ${{ steps.release_plan.outputs.publish }}
      draft: ${{ steps.release_plan.outputs.draft }}
      prerelease: ${{ steps.release_plan.outputs.prerelease }}
      include_planned: ${{ steps.release_plan.outputs.include_planned }}
      build_configuration_sha256: ${{ steps.release_plan.outputs.build_configuration_sha256 }}
      build_plan_sha256: ${{ steps.release_plan.outputs.build_plan_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Resolve source commit
        id: source
        shell: bash
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup exact .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build repository-owned release tools
        shell: pwsh
        run: |
          & dotnet build eng/release/Stark.ReleaseTools/Stark.ReleaseTools.csproj -c Release --nologo -warnaserror
          if ($LASTEXITCODE -ne 0) { throw "Stark.ReleaseTools build failed." }
          "RELEASE_TOOLS_DLL=$([System.IO.Path]::GetFullPath('eng/release/Stark.ReleaseTools/bin/Release/net10.0/Stark.ReleaseTools.dll'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate request and generate immutable release plan
        id: release_plan
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_TARGETS: ${{ inputs.targets }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_INCLUDE_PLANNED: ${{ inputs.include_planned }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & dotnet $env:RELEASE_TOOLS_DLL prepare-release `
            --event-name $env:GITHUB_EVENT_NAME `
            --resolved-commit "${{ steps.source.outputs.commit_sha }}" `
            --github-ref $env:GITHUB_REF `
            --github-ref-name $env:GITHUB_REF_NAME `
            --github-sha $env:GITHUB_SHA `
            --input-version $env:INPUT_VERSION `
            --input-ref $env:INPUT_REF `
            --input-commit $env:INPUT_COMMIT `
            --input-targets $env:INPUT_TARGETS `
            --input-publish $env:INPUT_PUBLISH `
            --input-draft $env:INPUT_DRAFT `
            --input-prerelease $env:INPUT_PRERELEASE `
            --input-include-planned $env:INPUT_INCLUDE_PLANNED `
            --require-release-tool `
            --plan-output artifacts/release-plan.json `
            --github-output $env:GITHUB_OUTPUT `
            2>&1 | Tee-Object -FilePath artifacts/release-prepare.log
          if ($LASTEXITCODE -ne 0) { throw "Release plan preparation failed." }
          & ./scripts/get-release-configuration-identity.ps1 -Root . -OutputPath artifacts/release-configuration-identity.json
          $configuration = Get-Content -LiteralPath artifacts/release-configuration-identity.json -Raw | ConvertFrom-Json
          if ([int]$configuration.schemaVersion -ne 1 -or [string]$configuration.identityKind -cne "stark-release-configuration") { throw "Invalid release configuration identity." }
          "build_configuration_sha256=$([string]$configuration.sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "build_plan_sha256=$((Get-FileHash -Algorithm SHA256 -LiteralPath artifacts/release-plan.json).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload immutable release plan and prepare diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release-plan.json
            artifacts/release-configuration-identity.json
            artifacts/release-prepare.log
          if-no-files-found: warn

  quality:
    name: Qualify release source
    runs-on: ubuntu-24.04
    needs: prepare
    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 1

      - name: Setup exact .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore checksum-verified Linux x64 LLVM inputs
        id: quality_llvm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/llvm-cache
          key: llvm-input-linux-x64-${{ hashFiles('scripts/llvm-22.1.8-assets.json', 'scripts/acquire-llvm-toolchain.ps1', 'scripts/llvm-source-build.ps1') }}

      - name: Acquire and verify pinned LLVM for repository quality
        id: quality_llvm
        shell: pwsh
        run: |
          $diagnosticsRoot = [System.IO.Path]::GetFullPath("artifacts/quality/backend")
          $toolchainRoot = [System.IO.Path]::GetFullPath("artifacts/toolchain/linux-x64")
          $cacheRoot = [System.IO.Path]::GetFullPath("artifacts/llvm-cache/linux-x64")
          New-Item -ItemType Directory -Force -Path $diagnosticsRoot | Out-Null

          & ./scripts/acquire-llvm-toolchain.ps1 `
            -AssetSuffix "linux-x64" `
            -OutputDir $toolchainRoot `
            -CacheDir $cacheRoot `
            2>&1 | Tee-Object -FilePath (Join-Path $diagnosticsRoot "llvm-acquisition.log")
          if ($LASTEXITCODE -ne 0) { throw "LLVM acquisition failed for the repository quality gate." }

          $expectedManifest = Get-Content -LiteralPath "scripts/llvm-22.1.8-assets.json" -Raw | ConvertFrom-Json
          $backendManifestPath = Join-Path $toolchainRoot "manifest.json"
          $backendManifest = Get-Content -LiteralPath $backendManifestPath -Raw | ConvertFrom-Json
          $expectedVersion = [string]$expectedManifest.llvmVersion
          if ([int]$backendManifest.schemaVersion -ne 2 -or
              [string]$backendManifest.payloadKind -cne "stark-compiler-private-backend" -or
              [string]$backendManifest.llvmVersion -cne $expectedVersion -or
              [string]$backendManifest.assetSuffix -cne "linux-x64" -or
              [string]$backendManifest.acquisitionKind -cne "upstream-archive") {
            throw "Repository quality acquired an unexpected compiler-private backend."
          }

          $clangPath = Join-Path $toolchainRoot "bin/clang"
          $llvmArPath = Join-Path $toolchainRoot "bin/llvm-ar"
          $versionLines = @(& $clangPath --version 2>&1 | ForEach-Object { [string]$_ })
          if ($LASTEXITCODE -ne 0 -or $versionLines.Count -eq 0) {
            throw "The pinned quality-gate Clang executable could not report its version."
          }
          $expectedPrefix = "clang version $expectedVersion"
          $firstVersionLine = $versionLines[0].Trim()
          if ($firstVersionLine -cne $expectedPrefix -and
              -not $firstVersionLine.StartsWith($expectedPrefix + " ", [StringComparison]::Ordinal)) {
            throw "Repository quality requires '$expectedPrefix'; acquired '$firstVersionLine'."
          }

          $versionLines | Set-Content -LiteralPath (Join-Path $diagnosticsRoot "clang-version.log") -Encoding utf8
          Copy-Item -LiteralPath $backendManifestPath -Destination (Join-Path $diagnosticsRoot "private-backend-manifest.json") -Force
          (Join-Path $toolchainRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "cache_key=llvm-input-linux-x64-${{ hashFiles('scripts/llvm-22.1.8-assets.json', 'scripts/acquire-llvm-toolchain.ps1', 'scripts/llvm-source-build.ps1') }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Save checksum-verified Linux x64 LLVM inputs
        if: ${{ steps.quality_llvm_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/llvm-cache
          key: ${{ steps.quality_llvm.outputs.cache_key }}

      - name: Run mandatory repository quality gate
        shell: pwsh
        run: >
          ./scripts/run-release-quality-gate.ps1
          -RepositoryRoot .
          -OutputDir artifacts/quality

      - name: Upload quality diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-attempt-${{ github.run_attempt }}
          path: |
            artifacts/quality
          if-no-files-found: warn

  build:
    name: Build ${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    needs: [prepare, quality]
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet_version }}

      - name: Verify exact .NET SDK
        shell: pwsh
        run: |
          $actualVersion = [string](& dotnet --version)
          if ($LASTEXITCODE -ne 0 -or $actualVersion.Trim() -cne "${{ matrix.dotnet_version }}") {
            throw "Release requires exact .NET SDK '${{ matrix.dotnet_version }}'; setup selected '$($actualVersion.Trim())'."
          }

      - name: Build repository-owned release tools
        shell: pwsh
        run: |
          & dotnet build eng/release/Stark.ReleaseTools/Stark.ReleaseTools.csproj -c Release --nologo -warnaserror
          if ($LASTEXITCODE -ne 0) { throw "Stark.ReleaseTools build failed." }
          "RELEASE_TOOLS_DLL=$([System.IO.Path]::GetFullPath('eng/release/Stark.ReleaseTools/bin/Release/net10.0/Stark.ReleaseTools.dll'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.rid }}-nuget-${{ hashFiles('global.json', 'src/compiler.csproj', 'src/packages.*.lock.json', 'eng/release/NuGet.config', 'eng/release/dependencies.json', 'eng/release/managed-license-evidence.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rid }}-nuget-

      - name: Restore exact managed dependency graph
        shell: pwsh
        run: |
          $nugetLockFile = [System.IO.Path]::GetFullPath("${{ matrix.nuget_lock_file }}")
          & dotnet restore src/compiler.csproj `
            -r "${{ matrix.rid }}" `
            --configfile "${{ matrix.nuget_config }}" `
            --use-lock-file `
            --locked-mode `
            --lock-file-path $nugetLockFile `
            -p:RuntimeFrameworkVersion=${{ matrix.dotnet_runtime_version }}
          if ($LASTEXITCODE -ne 0) {
            throw "Exact locked restore failed for ${{ matrix.rid }}."
          }
          $dotnetVersion = [string](& dotnet --version)
          & dotnet $env:RELEASE_TOOLS_DLL validate-managed-restore `
            --root . `
            --rid "${{ matrix.rid }}" `
            --assets src/obj/project.assets.json `
            --dotnet-version $dotnetVersion.Trim() `
            --restore-only `
            --output "artifacts/managed-restore-preflight-${{ matrix.asset_suffix }}.json"
          if ($LASTEXITCODE -ne 0) {
            throw "Managed restore validation failed for ${{ matrix.rid }}."
          }

      - name: Prepare exact managed license inventory
        shell: pwsh
        run: >
          & dotnet $env:RELEASE_TOOLS_DLL
          prepare-managed-licenses
          --root .
          --target-id ${{ matrix.target_id }}
          --assets src/obj/project.assets.json
          --output-root artifacts/managed-licenses/${{ matrix.asset_suffix }}

      - name: Cache checksum-verified release build-tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/release-build-tool-cache
          key: release-build-tools-${{ runner.os }}-${{ matrix.target_id }}-${{ hashFiles('eng/release/build-tools.json', 'scripts/acquire-release-build-tools.ps1', 'scripts/resolve-release-tools.ps1', 'eng/release/Stark.ReleaseTools/**') }}

      - name: Cache checksum-verified LLVM inputs
        if: ${{ matrix.target_id == 'linux-x64' || matrix.private_backend_acquisition == 'pinned-source-build' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/llvm-cache
          key: llvm-input-${{ matrix.target_id }}-${{ hashFiles('scripts/llvm-22.1.8-assets.json', 'scripts/acquire-llvm-toolchain.ps1', 'scripts/llvm-source-build.ps1') }}

      - name: Acquire pinned release build tools
        id: build_tools
        shell: pwsh
        run: |
          $toolRoot = [System.IO.Path]::GetFullPath("artifacts/release-build-tools/${{ matrix.asset_suffix }}")
          & ./scripts/acquire-release-build-tools.ps1 `
            -TargetId "${{ matrix.target_id }}" `
            -OutputDir $toolRoot `
            -CacheDir "artifacts/release-build-tool-cache/${{ matrix.asset_suffix }}" `
            -ReleaseToolsPath $env:RELEASE_TOOLS_DLL

          $manifestPath = Join-Path $toolRoot "manifest.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ([int]$manifest.schemaVersion -ne 1 -or
              [string]$manifest.purpose -cne "build-time-only" -or
              [string]$manifest.targetId -cne "${{ matrix.target_id }}" -or
              [string]$manifest.redistribution -cne "not-in-release-sdk") {
            throw "Acquired build-tool manifest has an unexpected identity or redistribution policy."
          }
          $rootPrefix = [System.IO.Path]::TrimEndingDirectorySeparator($toolRoot) + [System.IO.Path]::DirectorySeparatorChar
          foreach ($toolName in @("cmake", "ninja")) {
            $relativePath = [string]$manifest.tools.$toolName.path
            if ([string]::IsNullOrWhiteSpace($relativePath) -or
                [System.IO.Path]::IsPathRooted($relativePath) -or
                $relativePath.Contains("\") -or
                $relativePath.Split('/').Where({ $_ -in @("", ".", "..") }).Count -ne 0) {
              throw "Acquired $toolName path '$relativePath' is not portable."
            }
            $toolPath = [System.IO.Path]::GetFullPath((Join-Path $toolRoot $relativePath))
            if (-not $toolPath.StartsWith($rootPrefix, [StringComparison]::Ordinal) -or
                -not (Test-Path -LiteralPath $toolPath -PathType Leaf)) {
              throw "Acquired $toolName path '$relativePath' escapes or is missing."
            }
            "$($toolName)_path=$toolPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Publish compiler
        shell: pwsh
        run: |
          & dotnet publish src/compiler.csproj `
            -c Release `
            -r "${{ matrix.rid }}" `
            --self-contained true `
            --no-restore `
            -p:RuntimeFrameworkVersion=${{ matrix.dotnet_runtime_version }} `
            -p:PublishSingleFile=false `
            -p:InformationalVersion=$env:RELEASE_VERSION `
            -p:IncludeSourceRevisionInInformationalVersion=false `
            -p:WriteCompilerLauncherToRepoRoot=false `
            -o "artifacts/publish/${{ matrix.asset_suffix }}"
          if ($LASTEXITCODE -ne 0) { throw "Native Stage0 publish failed for ${{ matrix.target_id }}." }

          $actualArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant()
          if ($actualArchitecture -cne "${{ matrix.architecture }}") {
            throw "Release build for ${{ matrix.target_id }} requires a native ${{ matrix.architecture }} process; found '$actualArchitecture'."
          }
          $actualOperatingSystem = if ($IsWindows) { "windows" } elseif ($IsMacOS) { "macos" } elseif ($IsLinux) { "linux" } else { "unknown" }
          if ($actualOperatingSystem -cne "${{ matrix.operating_system }}") {
            throw "Release build for ${{ matrix.target_id }} requires ${{ matrix.operating_system }}; found '$actualOperatingSystem'."
          }
          $compilerName = if ($IsWindows) { "compiler.exe" } else { "compiler" }
          $stage0Compiler = [System.IO.Path]::GetFullPath((Join-Path "artifacts/publish/${{ matrix.asset_suffix }}" $compilerName))
          if (-not (Test-Path -LiteralPath $stage0Compiler -PathType Leaf)) {
            throw "Published native Stage0 apphost '$compilerName' is missing for ${{ matrix.target_id }}."
          }
          "STAGE0_COMPILER=$stage0Compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Acquire LLVM toolchain
        shell: pwsh
        run: |
          $evidenceRoot = "artifacts/backend-qualification/${{ matrix.asset_suffix }}"
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          & ./scripts/acquire-llvm-toolchain.ps1 `
            -AssetSuffix "${{ matrix.asset_suffix }}" `
            -ManifestPath "${{ matrix.llvm_manifest }}" `
            -OutputDir "artifacts/toolchain/${{ matrix.asset_suffix }}" `
            -CacheDir "artifacts/llvm-cache/${{ matrix.asset_suffix }}" `
            -CMakePath "${{ steps.build_tools.outputs.cmake_path }}" `
            -NinjaPath "${{ steps.build_tools.outputs.ninja_path }}" `
            2>&1 | Tee-Object -FilePath (Join-Path $evidenceRoot "llvm-acquisition.log")
          if ($LASTEXITCODE -ne 0) { throw "LLVM acquisition failed for ${{ matrix.target_id }}." }

      - name: Qualify source-built compiler-private backend
        if: ${{ matrix.private_backend_acquisition == 'pinned-source-build' }}
        shell: pwsh
        run: |
          $evidenceRoot = "artifacts/backend-qualification/${{ matrix.asset_suffix }}"
          & dotnet $env:RELEASE_TOOLS_DLL qualify-private-backend `
            --root . `
            --target-id "${{ matrix.target_id }}" `
            --toolchain-root "artifacts/toolchain/${{ matrix.asset_suffix }}" `
            --output (Join-Path $evidenceRoot "private-backend-report.json") `
            2>&1 | Tee-Object -FilePath (Join-Path $evidenceRoot "private-backend-qualification.log")
          if ($LASTEXITCODE -ne 0) { throw "Compiler-private backend qualification failed for ${{ matrix.target_id }}." }

      - name: Build standard library package
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STAGE0_COMPILER) -or -not (Test-Path -LiteralPath $env:STAGE0_COMPILER -PathType Leaf)) {
            throw "Published native Stage0 apphost is unavailable: '$env:STAGE0_COMPILER'."
          }
          New-Item -ItemType Directory -Force -Path "artifacts/stdlib/${{ matrix.asset_suffix }}" | Out-Null
          & $env:STAGE0_COMPILER `
            stdlib/src/System.stark `
            --emit-lib `
            --target "${{ matrix.target_triple }}" `
            --package-profile release `
            --toolchain-dir "artifacts/toolchain/${{ matrix.asset_suffix }}" `
            -o "artifacts/stdlib/${{ matrix.asset_suffix }}/${{ matrix.stdlib_library }}"
          if ($LASTEXITCODE -ne 0) { throw "Native Stage0 could not build optimized System for ${{ matrix.target_id }}." }

      - name: Qualify assembly bridge archive and ThinLTO lowering
        shell: pwsh
        run: |
          $evidenceRoot = "artifacts/backend-qualification/${{ matrix.asset_suffix }}/assembly-bridge"
          & ./scripts/qualify-assembly-bridge.ps1 `
            -CompilerPath $env:STAGE0_COMPILER `
            -TargetId "${{ matrix.target_id }}" `
            -TargetTriple "${{ matrix.target_triple }}" `
            -ToolchainDir "artifacts/toolchain/${{ matrix.asset_suffix }}" `
            -OutputDir $evidenceRoot
          if (-not $?) { throw "Assembly bridge archive/ThinLTO qualification failed for ${{ matrix.target_id }}." }

      - name: Prepare pinned official Vendor release input
        shell: pwsh
        run: |
          $arguments = @(
            "-AssetSuffix", "${{ matrix.asset_suffix }}",
            "-TargetTriple", "${{ matrix.target_triple }}",
            "-OutputVendorRoot", "artifacts/vendor/${{ matrix.asset_suffix }}",
            "-StdlibPackageDir", "artifacts/stdlib/${{ matrix.asset_suffix }}",
            "-RaylibManifestPath", "${{ matrix.raylib_manifest }}",
            "-ToolchainDir", "artifacts/toolchain/${{ matrix.asset_suffix }}",
            "-CMakePath", "${{ steps.build_tools.outputs.cmake_path }}",
            "-NinjaPath", "${{ steps.build_tools.outputs.ninja_path }}")
          if (-not [bool]::Parse("${{ matrix.release_enabled }}")) { $arguments += "-AllowPlannedTarget" }
          & ./scripts/prepare-vendor-release-input.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { throw "Vendor preparation failed for ${{ matrix.target_id }}." }

      - name: Package release archive
        id: package
        shell: pwsh
        run: |
          $arguments = @(
            "-Version", $env:RELEASE_VERSION,
            "-AssetSuffix", "${{ matrix.asset_suffix }}",
            "-PublishDir", "artifacts/publish/${{ matrix.asset_suffix }}",
            "-StdlibPackageDir", "artifacts/stdlib/${{ matrix.asset_suffix }}",
            "-ManagedLicenseDir", "artifacts/managed-licenses/${{ matrix.asset_suffix }}",
            "-VendorRoot", "artifacts/vendor/${{ matrix.asset_suffix }}",
            "-ToolchainDir", "artifacts/toolchain/${{ matrix.asset_suffix }}",
            "-ReleaseToolsPath", $env:RELEASE_TOOLS_DLL,
            "-RuntimeIdentifier", "${{ matrix.rid }}",
            "-TargetTriple", "${{ matrix.target_triple }}",
            "-CommitSha", $env:RELEASE_COMMIT,
            "-OutputDir", "artifacts/release",
            "-ArchiveKind", "${{ matrix.archive_kind }}",
            "-LlvmVersion", "${{ matrix.llvm_version }}",
            "-BuildConfigurationSha256", "${{ needs.prepare.outputs.build_configuration_sha256 }}",
            "-BuildPlanSha256", "${{ needs.prepare.outputs.build_plan_sha256 }}")
          if (-not [bool]::Parse("${{ matrix.release_enabled }}")) { $arguments += "-AllowPlannedTarget" }
          & ./scripts/package-release.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { throw "Release packaging failed for ${{ matrix.target_id }}." }

      - name: Validate staged SDK completeness
        shell: pwsh
        run: |
          $logPath = "artifacts/release/stage-validation-${{ matrix.asset_suffix }}.log"
          try {
            & dotnet $env:RELEASE_TOOLS_DLL validate-stage `
              --sdk-root "artifacts/release/stage/stark-$env:RELEASE_VERSION-${{ matrix.asset_suffix }}" `
              --target-id "${{ matrix.target_id }}" `
              --output "artifacts/release/stage-validation-${{ matrix.asset_suffix }}.json" `
              2>&1 | Tee-Object -FilePath $logPath
            if ($LASTEXITCODE -ne 0) {
              throw "Release stage validation exited with code $LASTEXITCODE."
            }
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $logPath
            throw
          }

      - name: Smoke packaged release archive
        shell: pwsh
        run: >
          ./scripts/smoke-release-archive.ps1
          -ArchivePath "${{ steps.package.outputs.archive_path }}"
          -TargetTriple "${{ matrix.target_triple }}"
          -IsolatePath

      - name: Validate packaged managed dependency closure
        shell: pwsh
        run: |
          $dotnetVersion = [string](& dotnet --version)
          & dotnet $env:RELEASE_TOOLS_DLL validate-managed-restore `
            --root . `
            --rid "${{ matrix.rid }}" `
            --assets src/obj/project.assets.json `
            --dotnet-version $dotnetVersion.Trim() `
            --candidate-sdk-root "artifacts/release/stage/stark-$env:RELEASE_VERSION-${{ matrix.asset_suffix }}" `
            --output "artifacts/managed-dependencies-${{ matrix.asset_suffix }}.json"
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged managed dependency validation failed for ${{ matrix.rid }}."
          }

      - name: Audit packaged native dependency closure
        if: ${{ always() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $logPath = "artifacts/release/native-dependencies-${{ matrix.asset_suffix }}.log"
          try {
            & ./scripts/audit-release-native-dependencies.ps1 `
              -SdkRoot "artifacts/release/stage/stark-$env:RELEASE_VERSION-${{ matrix.asset_suffix }}" `
              -OutputPath "artifacts/release/native-dependencies-${{ matrix.asset_suffix }}.json" `
              -ReleaseToolsPath $env:RELEASE_TOOLS_DLL `
              2>&1 | Tee-Object -FilePath $logPath
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $logPath
            throw
          }

      - name: Bind public evidence to the exact release candidate
        shell: pwsh
        run: >
          & dotnet $env:RELEASE_TOOLS_DLL
          candidate-evidence
          --bind
          --archive "${{ steps.package.outputs.archive_path }}"
          --sdk-root "artifacts/release/stage/stark-$env:RELEASE_VERSION-${{ matrix.asset_suffix }}"
          --managed-report "artifacts/managed-dependencies-${{ matrix.asset_suffix }}.json"
          --native-report "artifacts/release/native-dependencies-${{ matrix.asset_suffix }}.json"
          --stage-report "artifacts/release/stage-validation-${{ matrix.asset_suffix }}.json"

      - name: Upload restore diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-evidence-${{ matrix.asset_suffix }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/managed-restore-preflight-${{ matrix.asset_suffix }}.json
            artifacts/backend-qualification/${{ matrix.asset_suffix }}
            artifacts/toolchain/${{ matrix.asset_suffix }}/manifest.json
            artifacts/toolchain/${{ matrix.asset_suffix }}/provenance
            artifacts/toolchain/${{ matrix.asset_suffix }}/licenses
            artifacts/release-build-tools/${{ matrix.asset_suffix }}/manifest.json
          if-no-files-found: warn

      - name: Upload release candidate and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ matrix.asset_suffix }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/release/stark-*
            artifacts/release/native-dependencies-*.json
            artifacts/release/native-dependencies-*.log
            artifacts/release/stage-validation-*.json
            artifacts/release/stage-validation-*.log
            artifacts/managed-dependencies-*.json
            !artifacts/release/stage/**
          if-no-files-found: warn

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: [prepare, quality, install-smoke]
    if: ${{ needs.prepare.result == 'success' && needs.quality.result == 'success' && needs['install-smoke'].result == 'success' && needs.prepare.outputs.publish == 'true' }}
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 1

      - name: Setup exact .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build repository-owned release tools
        shell: pwsh
        run: |
          & dotnet build eng/release/Stark.ReleaseTools/Stark.ReleaseTools.csproj -c Release --nologo -warnaserror
          if ($LASTEXITCODE -ne 0) { throw "Stark.ReleaseTools build failed." }
          "RELEASE_TOOLS_DLL=$([System.IO.Path]::GetFullPath('eng/release/Stark.ReleaseTools/bin/Release/net10.0/Stark.ReleaseTools.dll'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download release archive artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-candidate-*-attempt-${{ github.run_attempt }}
          path: artifacts/downloaded
          merge-multiple: true

      - name: Select public assets and generate aggregate checksums
        shell: pwsh
        run: >
          ./scripts/prepare-release-public-assets.ps1
          -InputDirectory artifacts/downloaded
          -OutputDirectory artifacts/public-release-assets
          -ExpectedVersion "$env:RELEASE_VERSION"
          -ExpectedSourceCommit "${{ needs.prepare.outputs.commit_sha }}"
          -ExpectedConfigurationSha256 "${{ needs.prepare.outputs.build_configuration_sha256 }}"
          -ExpectedReleasePlanSha256 "${{ needs.prepare.outputs.build_plan_sha256 }}"
          -ExpectedTargets "${{ needs.prepare.outputs.target_ids }}"
          -ReleaseToolsPath "$env:RELEASE_TOOLS_DLL"

      - name: Bind source and reconcile draft release assets
        id: reconcile_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          & dotnet $env:RELEASE_TOOLS_DLL
          reconcile-github-release
          --mode prune
          --tag "$env:RELEASE_VERSION"
          --expected-commit "${{ needs.prepare.outputs.commit_sha }}"
          --desired-directory artifacts/public-release-assets
          --upload-directory artifacts/release-assets-to-upload
          --output artifacts/publication/prune.json
          --github-output "$env:GITHUB_OUTPUT"

      - name: Create or update GitHub release
        id: publish_release
        if: ${{ steps.reconcile_release.outputs.release_action_required == 'true' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ needs.prepare.outputs.commit_sha }}
          name: Stark ${{ env.RELEASE_VERSION }}
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: artifacts/release-assets-to-upload/*

      - name: Verify exact published asset inventory
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          & dotnet $env:RELEASE_TOOLS_DLL
          reconcile-github-release
          --mode verify
          --tag "$env:RELEASE_VERSION"
          --expected-commit "${{ needs.prepare.outputs.commit_sha }}"
          --desired-directory artifacts/public-release-assets
          --output artifacts/publication/verify.json

      - name: Configure verified release metadata and visibility
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          & dotnet $env:RELEASE_TOOLS_DLL
          reconcile-github-release
          --mode configure
          --tag "$env:RELEASE_VERSION"
          --expected-commit "${{ needs.prepare.outputs.commit_sha }}"
          --desired-directory artifacts/public-release-assets
          --desired-draft "${{ needs.prepare.outputs.draft }}"
          --prerelease "${{ needs.prepare.outputs.prerelease }}"
          --release-name "Stark $env:RELEASE_VERSION"
          --output artifacts/publication/configure.json

      - name: Retain publication reconciliation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-evidence-attempt-${{ github.run_attempt }}
          path: artifacts/publication
          if-no-files-found: warn

  install-smoke:
    name: Install smoke ${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.os }}
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 1

      - name: Download candidate release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ matrix.asset_suffix }}-attempt-${{ github.run_attempt }}
          path: smoke

      - name: Re-run archive smoke on downloaded candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/install-smoke | Out-Null
          $logPath = "artifacts/install-smoke/archive-smoke-${{ matrix.asset_suffix }}.log"
          $archives = @(Get-ChildItem -LiteralPath smoke -File -Recurse |
            Where-Object { $_.Name -like "stark-*-${{ matrix.asset_suffix }}*" -and $_.Extension -ne ".sha256" } |
            Sort-Object FullName)
          if ($archives.Count -ne 1) {
            throw "Expected exactly one downloaded release archive, found $($archives.Count)."
          }
          $archive = $archives[0]

          try {
            & ./scripts/smoke-release-archive.ps1 `
              -ArchivePath $archive.FullName `
              -TargetTriple "${{ matrix.target_triple }}" `
              -ReportPath "artifacts/install-smoke/archive-smoke-${{ matrix.asset_suffix }}.json" `
              -IsolatePath `
              2>&1 | Tee-Object -FilePath $logPath
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $logPath
            throw
          }

      - name: Qualify archive-local installer lifecycle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/install-smoke | Out-Null
          $logPath = "artifacts/install-smoke/installer-lifecycle-${{ matrix.asset_suffix }}.log"
          $archives = @(Get-ChildItem -LiteralPath smoke -File -Recurse |
            Where-Object { $_.Name -like "stark-*-${{ matrix.asset_suffix }}*" -and $_.Extension -ne ".sha256" } |
            Sort-Object FullName)
          if ($archives.Count -ne 1) {
            throw "Expected exactly one downloaded release archive, found $($archives.Count)."
          }
          $archive = $archives[0]

          try {
            & ./scripts/smoke-release-install.ps1 `
              -ArchivePath $archive.FullName `
              -TargetTriple "${{ matrix.target_triple }}" `
              -ReportPath "artifacts/install-smoke/installer-lifecycle-${{ matrix.asset_suffix }}.json" `
              -DiagnosticsDir "artifacts/install-smoke/installer-lifecycle-${{ matrix.asset_suffix }}" `
              2>&1 | Tee-Object -FilePath $logPath
          } catch {
            $_ | Out-String | Add-Content -LiteralPath $logPath
            throw
          }

      - name: Upload install-smoke diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: install-smoke-${{ matrix.asset_suffix }}-attempt-${{ github.run_attempt }}
          path: artifacts/install-smoke
          if-no-files-found: warn
