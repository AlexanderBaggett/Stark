name: Bug report
description: Report a reproducible compiler, SDK, library, or tooling defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private source, signing material, or unpatched security vulnerabilities. Use the repository's private vulnerability-reporting flow for security issues.
  - type: input
    id: version
    attributes:
      label: Stark version or commit
      description: Include `stark --version` output or the exact commit SHA.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Host and target
      description: OS version, architecture, and target triple.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest source/project and exact commands that reproduce the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
      description: Include relevant `stark doctor --format json` output after removing personal paths or secrets.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Package source, profile, optimization mode, regression range, screenshots, or benchmark evidence.
